plugins { id 'com.android.application' }

android {
    namespace 'com.ccs.sprig'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ccs.sprig'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1 Preview'
        testInstrumentationRunner 'com.ccs.sprig.validation.Stage04Instrumentation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/services/reactor.blockhound.integration.BlockHoundIntegration']
        resources.merges += ['META-INF/io.netty.versions.properties', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':core')
    implementation project(':oast')
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
