# Delegate this domain to the server's authoritative DNS address before public use.
domain=oast.example.com
publicAddress=203.0.113.10
bind=0.0.0.0
# Put an HTTPS reverse proxy in front of this loopback-only management API.
apiBind=127.0.0.1
apiPort=18081
apiTls=false
httpPort=18080
dnsPort=15353
smtpPort=12525
httpsPort=18443
smtpsPort=12465
# Optional wildcard certificate and key as PKCS12. Password via SPRIG_TLS_PASSWORD.
# tlsKeyStore=/etc/sprig/wildcard.p12
